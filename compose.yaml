services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pantrypilot
      POSTGRES_USER: pantrypilot
      POSTGRES_PASSWORD: local-only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantrypilot -d pantrypilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    ports: ["3001:3001"]
    depends_on:
      postgres:
        condition: service_healthy
volumes: { pgdata: {} }
